<script>
/* SHIN AIOS v2 — additive demo module. No existing source files modified. */
(function(){'use strict';
const STORAGE='shin_v2_complete_demo_20261103';
const seed={
 schedule:[{id:'TD-001',site:'SVH',name:'Tháo dỡ và thu dọn mặt bằng',owner:'Đội thi công KPD',start:'2026-11-02',end:'2026-11-20',progress:45},{id:'TD-002',site:'STN',name:'Khảo sát điện, mạng và camera',owner:'Tổ kỹ thuật',start:'2026-11-03',end:'2026-11-15',progress:30},{id:'TD-003',site:'SVH',name:'Nghiệm thu hạng mục phần thô',owner:'Giám sát hiện trường',start:'2026-11-18',end:'2026-12-10',progress:0}],
 materials:[{id:'VT-001',site:'SVH',name:'Xi măng PCB40',qty:120,unit:'bao',supplier:'Nhà cung cấp A',checks:[false,false,false,false]},{id:'VT-002',site:'STN',name:'Thép D12',qty:750,unit:'kg',supplier:'Nhà cung cấp B',checks:[true,false,false,false]}],
 diary:[{id:'NK-001',site:'SVH',date:'2026-11-02',work:'Tháo dỡ khu vực thi công theo ranh giới',workers:18,note:'Đảm bảo rào chắn và an toàn HSE'}]};
const clone=x=>JSON.parse(JSON.stringify(x));let data;let storageOK=true;
try{const raw=localStorage.getItem(STORAGE);data=raw?JSON.parse(raw):clone(seed);if(!data||!Array.isArray(data.schedule)||!Array.isArray(data.materials)||!Array.isArray(data.diary))throw Error('invalid')}catch(e){data=clone(seed);storageOK=false}
const E=x=>String(x??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const VN=x=>new Intl.NumberFormat('vi-VN').format(Number(x)||0);
const date=x=>/^\d{4}-\d{2}-\d{2}$/.test(x||'')?x.slice(8)+'/'+x.slice(5,7)+'/'+x.slice(0,4):'—';
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const siteOptions='<option value="SVH">Sở Văn Hóa (SVH)</option><option value="STN">Sở Tài Nguyên (STN)</option>';
const sites={SVH:'Sở Văn Hóa',STN:'Sở Tài Nguyên'};
let route='home',filters={schedule:'ALL',materials:'ALL',diary:'ALL'},search={schedule:'',materials:'',diary:''},kpiFilter={schedule:'all',materials:'all',diary:'all'},editing=null,originalNodes=[],pendingUndo=null,deleteArmed={};
const save=()=>{try{localStorage.setItem(STORAGE,JSON.stringify(data));storageOK=true;return true}catch(e){storageOK=false;notice('Không thể lưu demo. Hãy kiểm tra dung lượng trình duyệt.','error');return false}};
function notice(msg,type='info'){if(typeof window.toast==='function')window.toast(msg,type);else{const x=document.getElementById('demo-feedback');if(x){x.textContent=msg;x.hidden=false}}}
const greeting=()=>{const h=new Date().getHours();return h<11?'Chào buổi sáng':h<14?'Chào buổi trưa':h<18?'Chào buổi chiều':'Chào buổi tối'};
const hero=(title,stats,cta)=>`<div class="hn-hero"><div class="hn-hero-top"><div><div class="hn-chao">${greeting()}, Sếp</div><div class="hn-ngay">${date(today())} · ${E(title)}</div></div><span class="demo-tag">DEMO</span></div><div class="tq-3so demo-stats">${stats.map((s,i)=>`<button type="button" class="tq-o demo-stat ${kpiFilter[route]===s.key?'demo-filter-active':''}" data-demo="kpi" data-value="${s.key}"><strong>${E(s.value)}</strong><small>${E(s.label)}</small></button>`).join('')}</div><button class="btn-primary" data-demo="create">＋ ${E(cta)}</button></div>`;
const toolbar=(kind)=>`<div class="demo-toolbar"><select aria-label="Lọc công trường" data-demo="site"><option value="ALL">Tất cả công trường</option>${siteOptions}</select><input aria-label="Tìm kiếm" data-demo="search" placeholder="Tìm kiếm trong danh sách..." value="${E(search[kind])}"></div>`;
const actionButtons=id=>`<div class="demo-actions"><button data-demo="edit" data-id="${E(id)}">Chỉnh sửa</button><button class="demo-danger" data-demo="delete" data-id="${E(id)}">Xóa</button></div>`;
const listEmpty='<div class="demo-empty">Chưa có dữ liệu phù hợp. Hãy đổi bộ lọc hoặc tạo bản ghi mới.</div>';
function list(kind){let arr=data[kind].filter(x=>(filters[kind]==='ALL'||x.site===filters[kind])&&JSON.stringify([x.name,x.work,x.owner,x.supplier,x.id]).toLowerCase().includes(search[kind].toLowerCase()));if(kind==='schedule'&&kpiFilter[kind]==='working')arr=arr.filter(x=>x.progress>0&&x.progress<100);if(kind==='schedule'&&kpiFilter[kind]==='done')arr=arr.filter(x=>x.progress===100);if(kind==='materials'&&kpiFilter[kind]==='pending')arr=arr.filter(x=>!x.checks.every(Boolean));if(kind==='materials'&&kpiFilter[kind]==='done')arr=arr.filter(x=>x.checks.every(Boolean));if(kind==='diary'&&kpiFilter[kind]==='today')arr=arr.filter(x=>x.date===today());
return arr.map(x=>{let details='';if(kind==='schedule'){details=`<div class="demo-muted">${E(x.owner)} · ${date(x.start)} – ${date(x.end)}</div><div class="demo-progress"><span style="width:${Math.max(0,Math.min(100,Number(x.progress)||0))}%"></span></div><div class="demo-inline"><span class="demo-status ${x.progress===100?'ok':''}">${x.progress===100?'Hoàn thành':x.progress>0?'Đang thực hiện':'Chưa bắt đầu'} · ${VN(x.progress)}%</span><button class="btn-secondary" data-demo="advance" data-id="${E(x.id)}">+ 10%</button></div>`}else if(kind==='materials'){details=`<div class="demo-muted">${VN(x.qty)} ${E(x.unit)} · ${E(x.supplier)}</div><div class="demo-status ${x.checks.every(Boolean)?'ok':''}">${x.checks.every(Boolean)?'Đủ 4 bên (mô phỏng)':'Chờ xác nhận (mô phỏng)'}</div>${['Giám sát','Nhà cung cấp','Nhà thầu','Tổ giám sát Thanh Vũ'].map((role,i)=>`<label class="demo-check"><span>${role}</span><input type="checkbox" data-demo="check" data-id="${E(x.id)}" data-index="${i}" ${x.checks[i]?'checked':''} aria-label="Xác nhận demo ${role}"></label>`).join('')}`}else{details=`<div class="demo-muted">Ngày ${date(x.date)} · ${VN(x.workers)} nhân sự</div><p class="demo-note">${E(x.note||'Không có ghi chú HSE')}</p><p class="demo-note">GPS và ảnh: chưa ghi nhận (demo)</p>`}return `<article class="demo-item"><div class="demo-item-head"><div><span class="demo-badge">${E(x.site)}</span> <span class="demo-title">${E(x.name||x.work)}</span></div><small class="demo-muted">${E(x.id)}</small></div>${details}${actionButtons(x.id)}</article>`}).join('')||listEmpty}
function fields(kind,item){const val=(key)=>E(item?.[key]??'');const field=(label,key,type='text',attrs='')=>`<label>${label}<input name="${key}" type="${type}" value="${val(key)}" ${attrs} required></label>`;let common=`<label>Công trường<select name="site">${siteOptions}</select></label>`;if(kind==='schedule')return `${field('Tên hạng mục','name','text','maxlength="120"')}${common}${field('Người phụ trách','owner','text','maxlength="80"')}${field('Bắt đầu','start','date')}${field('Kết thúc','end','date')}${field('Tiến độ (%)','progress','number','min="0" max="100"')}`;if(kind==='materials')return `${field('Tên vật tư','name','text','maxlength="120"')}${common}${field('Số lượng','qty','number','min="0.01" step="any"')}${field('Đơn vị','unit','text','maxlength="30"')}${field('Nhà cung cấp','supplier','text','maxlength="100"')}`;return `${common}${field('Ngày thi công','date','date')}${field('Nội dung công việc','work','text','maxlength="250"')}${field('Nhân sự','workers','number','min="0" max="100000"')}<label>Ghi chú HSE<textarea name="note" maxlength="1500">${val('note')}</textarea></label>`}
function render(){if(route==='home')return;const root=document.getElementById('demo-screen-'+route);if(!root)return;const kind=route,arr=data[kind];let stats,title,cta;if(kind==='schedule'){title='Tiến độ & WBS';cta='Thêm hạng mục';stats=[{key:'all',value:arr.length,label:'Hạng mục'},{key:'working',value:arr.filter(x=>x.progress>0&&x.progress<100).length,label:'Đang làm'},{key:'done',value:arr.filter(x=>x.progress===100).length,label:'Hoàn thành'}]}else if(kind==='materials'){title='Vật tư 4 bên';cta='Tạo phiếu giao nhận';stats=[{key:'all',value:arr.length,label:'Tổng phiếu'},{key:'pending',value:arr.filter(x=>!x.checks.every(Boolean)).length,label:'Chờ duyệt'},{key:'done',value:arr.filter(x=>x.checks.every(Boolean)).length,label:'Đủ 4 bên'}]}else{title='Nhật ký công trường';cta='Tạo nhật ký';stats=[{key:'all',value:arr.length,label:'Nhật ký'},{key:'today',value:arr.filter(x=>x.date===today()).length,label:'Hôm nay'},{key:'other',value:arr.filter(x=>x.workers>0).length,label:'Có nhân sự'}]}
root.innerHTML=`<div class="page-title">${title}</div>${hero(title,stats,cta)}<div class="hn-tieu">DANH SÁCH ${kind==='schedule'?'HẠNG MỤC':kind==='materials'?'PHIẾU VẬT TƯ':'NHẬT KÝ'}</div>${toolbar(kind)}<div id="demo-list">${list(kind)}</div><div class="demo-panel" id="demo-editor" hidden><h3 id="demo-editor-title">Thêm mới</h3><form id="demo-form" class="demo-form"></form></div><p class="demo-note">Dữ liệu mẫu chỉ lưu trên trình duyệt này · Không phải phê duyệt hoặc hồ sơ thi công chính thức.</p><div class="demo-actions"><button data-demo="reset">Khôi phục dữ liệu mẫu</button><button data-demo="export">Xuất JSON demo</button></div><p id="demo-feedback" class="demo-error" hidden></p>`;
root.querySelector('[data-demo="site"]').value=filters[kind];}
function editor(item){editing=item?.id||null;const panel=document.getElementById('demo-editor');panel.hidden=false;document.getElementById('demo-editor-title').textContent=item?'Chỉnh sửa dữ liệu demo':'Thêm dữ liệu demo';const form=document.getElementById('demo-form');form.innerHTML=fields(route,item)+`<div class="demo-actions"><button type="submit" class="btn-primary">Lưu dữ liệu demo</button><button type="button" class="btn-secondary" data-demo="cancel">Hủy</button></div>`;form.elements.site.value=item?.site||'SVH';if(route==='diary'&&!item)form.elements.date.value=today();if(route==='schedule'&&!item)form.elements.progress.value=0;panel.scrollIntoView({behavior:'smooth',block:'nearest'})}
function remove(kind,id){const idx=data[kind].findIndex(x=>x.id===id);if(idx<0)return;const deleted=data[kind].splice(idx,1)[0];save();render();if(pendingUndo)clearTimeout(pendingUndo.timer);const undo=()=>{data[kind].splice(Math.min(idx,data[kind].length),0,deleted);save();render()};if(typeof window.toast==='function')window.toast('Đã xóa bản ghi demo','warn',{nhan:'Hoàn tác',bam:undo});else{const fb=document.getElementById('demo-feedback');fb.hidden=false;fb.innerHTML='Đã xóa. <button type="button" id="demo-undo">Hoàn tác trong 6 giây</button>';fb.querySelector('button').onclick=undo;pendingUndo={timer:setTimeout(()=>{if(fb)fb.hidden=true},6000)}}}
function show(kind){if(kind==='home'){route='home';originalNodes.forEach(n=>n.style.display=n.dataset.demoDisplay||'');document.querySelectorAll('.shin-demo-screen').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.tab==='hom-nay'));return}if(!['schedule','materials','diary'].includes(kind))return; if(route==='home')originalNodes.forEach(n=>{n.dataset.demoDisplay=n.style.display;n.style.display='none'});route=kind;document.querySelectorAll('.shin-demo-screen').forEach(x=>x.classList.toggle('active',x.id==='demo-screen-'+kind));const map={schedule:'tien-do',materials:'vat-tu',diary:'nhat-ky'};document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.tab===map[kind]));render();document.getElementById('appContent').scrollTop=0;window.scrollTo(0,0)}
function init(){const main=document.getElementById('appContent');if(!main||!window.ShinApp)return;originalNodes=Array.from(main.children);for(const kind of ['schedule','materials','diary']){const node=document.createElement('section');node.className='shin-demo-screen';node.id='demo-screen-'+kind;main.appendChild(node)}const old=ShinApp.chuyenTab.bind(ShinApp);ShinApp.chuyenTab=function(tab,el){const routes={'Tiến độ & Giao ban':'schedule','tien-do':'schedule','Giao nhận vật tư 4 bên':'materials','vat-tu':'materials','Nhật ký & An toàn HSE':'diary','nhat-ky':'diary'};if(routes[tab]){show(routes[tab]);return}if(tab==='hom-nay'){show('home');return old(tab,el)}return old(tab,el)};
// Navigation is adjusted at runtime in preview only. Original files remain byte-identical.
const approval=document.querySelector('.nav-item[data-tab="phe-duyet"]');if(approval){approval.dataset.tab='nhat-ky';approval.setAttribute('onclick',"ShinApp.chuyenTab('nhat-ky',this)");const label=approval.querySelector('.bottom-nav-label');if(label)label.textContent='Nhật ký';const icon=approval.querySelector('.bottom-nav-icon');if(icon&&window.ShinIcons)icon.innerHTML=window.ShinIcons.clipboard||'📒'}
main.addEventListener('input',e=>{if(e.target.matches('[data-demo="search"]')){search[route]=e.target.value;const listNode=document.getElementById('demo-list');if(listNode)listNode.innerHTML=list(route)}});
main.addEventListener('change',e=>{const t=e.target;if(t.dataset.demo==='site'){filters[route]=t.value;document.getElementById('demo-list').innerHTML=list(route)}if(t.dataset.demo==='check'){const x=data.materials.find(z=>z.id===t.dataset.id);if(x){x.checks[Number(t.dataset.index)]=t.checked;save();render()}}});
main.addEventListener('click',e=>{const t=e.target.closest('[data-demo]');if(!t||route==='home')return;const act=t.dataset.demo,id=t.dataset.id;if(act==='create')editor(null);if(act==='cancel')document.getElementById('demo-editor').hidden=true;if(act==='edit'){const item=data[route].find(x=>x.id===id);if(item)editor(item)}if(act==='delete')remove(route,id);if(act==='advance'){const x=data.schedule.find(x=>x.id===id);if(x){x.progress=Math.min(100,x.progress+10);save();render()}}if(act==='kpi'){kpiFilter[route]=t.dataset.value;render()}if(act==='reset'){const now=Date.now();if(!deleteArmed.reset||now-deleteArmed.reset>5000){deleteArmed.reset=now;notice('Bấm lần nữa trong 5 giây để khôi phục dữ liệu demo','warn');return}deleteArmed.reset=0;data=clone(seed);save();render()}if(act==='export'){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='shin-aios-demo-data.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}});
main.addEventListener('submit',e=>{if(e.target.id!=='demo-form')return;e.preventDefault();const f=e.target,raw=Object.fromEntries(new FormData(f));const kind=route;if(kind==='schedule'){raw.progress=Number(raw.progress);if(raw.end<raw.start){notice('Ngày kết thúc phải từ ngày bắt đầu trở đi','error');return}if(raw.progress<0||raw.progress>100)return}if(kind==='materials'){raw.qty=Number(raw.qty);if(!(raw.qty>0))return;raw.checks=editing?(data.materials.find(x=>x.id===editing)?.checks||[false,false,false,false]):[false,false,false,false]}if(kind==='diary')raw.workers=Number(raw.workers);if(editing){const index=data[kind].findIndex(x=>x.id===editing);if(index>=0)data[kind][index]={...data[kind][index],...raw}}else data[kind].unshift({...raw,id:(kind==='schedule'?'TD':kind==='materials'?'VT':'NK')+'-'+Date.now()});save();render()});
window.ShinDemoV2={open:show,reset:()=>{data=clone(seed);save();render()},getData:()=>clone(data)};}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>
